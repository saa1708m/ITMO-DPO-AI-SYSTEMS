name: mlops-ci-example

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Базовые зависимости для модулей 2–4
          pip install pandas scikit-learn joblib mlflow fastapi uvicorn pytest

      - name: Run unit tests (if any)
        run: |
          # Здесь можно добавить тесты из модулей 3–4
          echo "No unit tests configured yet"

      - name: Preprocess data (Module 2 script)
        run: |
          cd M2-data-management-and-versioning/attachments
          python scripts/preprocess_beijing.py

      - name: Train model with MLflow (Module 3 script)
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          cd M3-model-development-and-experiments/attachments
          python train_mlflow_dry_beans.py

      - name: Archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            M2-data-management-and-versioning/attachments/data/**
            M3-model-development-and-experiments/attachments/mlruns/**
          if-no-files-found: ignore
